# backend/pyproject.toml
[project]
name = "ping-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "supabase>=2.4",
    "httpx>=0.27",
    "redis>=5.0",
    "pyjwt>=2.8",
    "eth-account>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
